<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
    <clipPath id="lightHalf"><polygon points="256,0 256,256 0,256"/></clipPath>
    <clipPath id="darkHalf"><polygon points="0,0 256,0 0,256"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- dark half -->
    <rect x="0" y="0" width="256" height="256" fill="#1e2230"/>
    <!-- light half -->
    <polygon points="256,0 256,256 0,256" fill="#f4efe3"/>
  </g>

  <!-- page on the dark side -->
  <g clip-path="url(#darkHalf)">
    <rect x="62" y="44" width="132" height="168" rx="14" fill="#2c3245" stroke="#8b93b0" stroke-width="6"/>
    <g stroke="#8b93b0" stroke-width="9" stroke-linecap="round">
      <line x1="88" y1="84" x2="168" y2="84"/>
      <line x1="88" y1="112" x2="168" y2="112"/>
      <line x1="88" y1="140" x2="150" y2="140"/>
      <line x1="88" y1="168" x2="160" y2="168"/>
    </g>
  </g>

  <!-- the same page on the light side -->
  <g clip-path="url(#lightHalf)">
    <rect x="62" y="44" width="132" height="168" rx="14" fill="#ffffff" stroke="#3b4a6b" stroke-width="6"/>
    <g stroke="#3b4a6b" stroke-width="9" stroke-linecap="round">
      <line x1="88" y1="84" x2="168" y2="84"/>
      <line x1="88" y1="112" x2="168" y2="112"/>
      <line x1="88" y1="140" x2="150" y2="140"/>
      <line x1="88" y1="168" x2="160" y2="168"/>
    </g>
  </g>

  <!-- sun badge, bottom right -->
  <g transform="translate(196 196)">
    <circle r="30" fill="#f5b83d" stroke="#f4efe3" stroke-width="6"/>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-19" x2="0" y2="-14"/>
      <line x1="0" y1="19" x2="0" y2="14"/>
      <line x1="-19" y1="0" x2="-14" y2="0"/>
      <line x1="19" y1="0" x2="14" y2="0"/>
      <line x1="-13.4" y1="-13.4" x2="-9.9" y2="-9.9"/>
      <line x1="13.4" y1="13.4" x2="9.9" y2="9.9"/>
      <line x1="-13.4" y1="13.4" x2="-9.9" y2="9.9"/>
      <line x1="13.4" y1="-13.4" x2="9.9" y2="-9.9"/>
    </g>
    <circle r="9" fill="#ffffff"/>
  </g>

  <!-- moon badge, top left -->
  <g transform="translate(60 60)">
    <circle r="30" fill="#3d4766" stroke="#1e2230" stroke-width="6"/>
    <path d="M6 -14 A15 15 0 1 0 14 8 A12 12 0 1 1 6 -14 Z" fill="#e8ecf7"/>
  </g>
</svg>
